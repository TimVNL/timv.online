<pre class="font-mono whitespace-pre-wrap leading-relaxed">{{ range $i, $t := .items }}{{ if gt $i 0 }}
{{ end }}<span class="text-accent-purple">&gt;</span> <span class="italic nerdy-muted-soft">"{{ $t.quote }}"</span>
  <span class="font-bold text-accent-emerald">{{ $t.name }}</span> <span class="text-accent-cyan">, {{ $t.company }}</span>
{{ end }}</pre>
