person_name: "Tim Veluwenkamp"
summary: Support Engineer at Hypernode by day, homelab admin and virtual trucker after hours.
details:
  - My tech journey started at 11 with my first website, built in Microsoft FrontPage.
  - First jobs: ICT support in education, then programmer and system administrator at NoXqs from 2011 to 2017.
  - Hosting came next: iXL Hosting, then Proserve, from technical support in 2018 to Linux engineering.
  - Since September 2025 I'm a Support Engineer at Hypernode in Arnhem: platform support, documentation at docs.hypernode.com, and incident communication to merchants, developers, and agencies when a zero-day lands.
  - Off the clock I run an Unraid homelab, maintain WordPress sites for family and clubs, and haul virtual freight in Euro Truck Simulator 2.
