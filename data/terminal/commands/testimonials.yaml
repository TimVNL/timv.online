items:
  - quote: >-
      Tim heeft bijna 3 jaar gewerkt bij de Onderwijsspecialisten in Arnhem. Hij is er als stagiaire begonnen en werd er later vrijwilliger. Zijn werkzaamheden bestonden uit het ondersteunen bij de taken van de ICT-coördinator. Tim heeft een enorme ontwikkeling doorgemaakt. Door zijn doorzettingsvermogen heeft hij uiteindelijk een baan gevonden in de ICT die bij hem past. Het was prettig om met hem te werken.
    name: Elle Peters
    company: De Onderwijsspecialisten
  - quote: >-
      Tim heeft een bevlogen karakter als het gaat om welke vorm van ICT en media dan ook! Hij is altijd op de hoogte van de nieuwe tips & trucs en immer bereid je deze uit te leggen: erg plezierig om mee te werken!
    name: Sietske Vissers
    company: De Onderwijsspecialisten
  - quote: >-
      Tim is zeer deskundig, op zoek naar oplossingen en heeft teamspirit. Boven alles is hij ook nog eens een fijne collega.
    name: Henk Dijk
    company: NoXqs
  - quote: >-
      Wij hebben Tim leren kennen als een fijne collega, die altijd klaar stond voor zijn collega's, ook na kantooruren. We bedanken hem oprecht voor zijn inzet.
    name: Karlijn Migo-Merx
    company: NoXqs
