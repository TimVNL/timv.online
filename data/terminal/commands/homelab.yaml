  uptime: "6 days"
  network: everything through pangolin · 0 ports exposed
services:
  # Real containers on the Unraid box.
  - name: adguard
    image: adguard/adguardhome
    status: Up
  - name: adguardhome-sync
    image: linuxserver/adguardhome-sync
    status: Up
  - name: pangolin-newt
    image: fosrl/newt
    status: Up
  - name: jellyfin
    image: linuxserver/jellyfin
    status: Up
  - name: EuroTruckSimulator2
    image: ich777/steamcmd:ets2
    status: Up
